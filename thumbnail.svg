<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <!-- Background -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#07111b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTopRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e78ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07111b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#07111b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="accentGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="640" fill="#07111b"/>

  <!-- Grid pattern -->
  <g opacity="1">
    <!-- Vertical grid lines -->
    <line x1="48"  y1="0" x2="48"  y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="96"  y1="0" x2="96"  y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="144" y1="0" x2="144" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="192" y1="0" x2="192" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="288" y1="0" x2="288" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="336" y1="0" x2="336" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="384" y1="0" x2="384" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="432" y1="0" x2="432" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="528" y1="0" x2="528" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="576" y1="0" x2="576" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="624" y1="0" x2="624" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="672" y1="0" x2="672" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="768" y1="0" x2="768" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="816" y1="0" x2="816" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="864" y1="0" x2="864" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="912" y1="0" x2="912" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1008" y1="0" x2="1008" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1056" y1="0" x2="1056" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1104" y1="0" x2="1104" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1152" y1="0" x2="1152" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="1248" y1="0" x2="1248" y2="640" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="48"  x2="1280" y2="48"  stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="96"  x2="1280" y2="96"  stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="144" x2="1280" y2="144" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="192" x2="1280" y2="192" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="288" x2="1280" y2="288" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="336" x2="1280" y2="336" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="384" x2="1280" y2="384" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="432" x2="1280" y2="432" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="528" x2="1280" y2="528" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="576" x2="1280" y2="576" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
    <line x1="0" y1="624" x2="1280" y2="624" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.04"/>
  </g>

  <!-- Glow blobs -->
  <ellipse cx="640" cy="320" rx="500" ry="400" fill="url(#glowCenter)"/>
  <ellipse cx="1150" cy="60" rx="340" ry="280" fill="url(#glowTopRight)"/>
  <ellipse cx="130" cy="560" rx="280" ry="240" fill="url(#glowBottomLeft)"/>

  <!-- Scan lines -->
  <rect x="0" y="68" width="1280" height="1" fill="url(#scanGrad)"/>
  <rect x="0" y="571" width="1280" height="1" fill="url(#scanGrad)"/>

  <!-- Corner brackets -->
  <path d="M28,28 L28,68 M28,28 L68,28" stroke="#00ff88" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <path d="M1252,28 L1252,68 M1252,28 L1212,28" stroke="#00ff88" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <path d="M28,612 L28,572 M28,612 L68,612" stroke="#00ff88" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <path d="M1252,612 L1252,572 M1252,612 L1212,612" stroke="#00ff88" stroke-width="2" stroke-opacity="0.35" fill="none"/>

  <!-- Dot rows top/bottom center -->
  <circle cx="608" cy="40" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="622" cy="40" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="636" cy="40" r="2" fill="#00ff88" fill-opacity="0.6"/>
  <circle cx="650" cy="40" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="664" cy="40" r="2" fill="#00ff88" fill-opacity="0.3"/>

  <circle cx="608" cy="600" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="622" cy="600" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="636" cy="600" r="2" fill="#00ff88" fill-opacity="0.6"/>
  <circle cx="650" cy="600" r="2" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="664" cy="600" r="2" fill="#00ff88" fill-opacity="0.3"/>

  <!-- Logo: SEC (white glow) -->
  <text x="536" y="340" text-anchor="end"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="100" font-weight="400" letter-spacing="14"
    fill="#f3f7ff" filter="url(#textGlow)">SEC</text>

  <!-- Logo: 101 (green glow accent) -->
  <text x="548" y="340" text-anchor="start"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="100" font-weight="400" letter-spacing="14"
    fill="#00ff88" filter="url(#accentGlow)">101</text>
</svg>
