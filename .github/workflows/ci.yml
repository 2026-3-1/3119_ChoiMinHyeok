name: CI

on:
  push:
    branches: [main, P2, P3]
  pull_request:
    branches: [P1]

jobs:
  backend-build:
    name: Backend · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci_db
      - run: npm run lint
      - run: npm run build

  frontend-build:
    name: Frontend · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
