<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="blurSm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060b14"/>

  <!-- Atmospheric glow -->
  <ellipse cx="600" cy="315" rx="420" ry="220" fill="#3b82f6" fill-opacity="0.09" filter="url(#blur)"/>

  <rect width="1200" height="630" fill="url(#glow1)" opacity="0.6"/>

  <!-- Horizontal hairlines -->
  <line x1="0" y1="314" x2="1200" y2="314" stroke="#1e3a5f" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="212" x2="1200" y2="212" stroke="#1e3a5f" stroke-width="0.4" opacity="0.18"/>
  <line x1="0" y1="418" x2="1200" y2="418" stroke="#1e3a5f" stroke-width="0.4" opacity="0.18"/>

  <!-- Vertical hairlines -->
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3"/>
  <line x1="380" y1="0" x2="380" y2="630" stroke="#1e3a5f" stroke-width="0.4" opacity="0.1"/>
  <line x1="820" y1="0" x2="820" y2="630" stroke="#1e3a5f" stroke-width="0.4" opacity="0.1"/>

  <!-- Corner brackets -->
  <path d="M80,60 L80,80 L100,80" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.5"/>
  <path d="M1120,60 L1120,80 L1100,80" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.5"/>
  <path d="M80,570 L80,550 L100,550" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.5"/>
  <path d="M1120,570 L1120,550 L1100,550" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.5"/>

  <!-- Blinking dot top left -->
  <circle cx="100" cy="76" r="3" fill="#3b82f6" opacity="0.7"/>

  <!-- Main logo wordmark -->
  <text
    x="600" y="310"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="108"
    font-weight="800"
    fill="#e2e8f0"
    text-anchor="middle"
    letter-spacing="16"
  >VERI<tspan fill="#3b82f6">WEB</tspan></text>

  <!-- Subtle glow under text -->
  <ellipse cx="600" cy="330" rx="300" ry="18" fill="#3b82f6" fill-opacity="0.12" filter="url(#blurSm)"/>
</svg>
